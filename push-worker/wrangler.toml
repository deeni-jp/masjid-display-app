# Cloudflare Worker that sends push notifications for masjid notices.
# Deploy: npm install && npx wrangler deploy   (see README.md here)
# Set FIREBASE_PROJECT_ID (and ALLOWED_ORIGINS if the web app sends notices)
# to your own values before deploying.
name = "masjid-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
# Browser origins allowed to call the worker (the web app), comma-separated,
# e.g. "https://your-project.web.app". Mobile apps don't need CORS.
# http://localhost:* is always allowed for development.
ALLOWED_ORIGINS = ""

# Secret (never committed): set with
#   npx wrangler secret put SERVICE_ACCOUNT_JSON
# and paste the whole service-account JSON key file.
