name: prayer_app
description: A prayer time app for masjids
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0
  permission_handler: ^11.0.0
  geocoding: ^4.0.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.1
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^18.0.1
  cloud_functions: ^6.0.0
  win32: ^5.15.0
  google_fonts: ^6.3.2
  flutter_dotenv: ^5.2.1
  image_picker: ^1.2.3
  image: ^4.12.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Mocking
  mockito: ^5.4.4
  build_runner: ^2.4.13

  # Firebase Testing (Note: We'll use mockito for Firebase mocking instead)
  # fake_cloud_firestore has version conflicts with Firebase 4+

  # Integration Testing
  integration_test:
    sdk: flutter

  # HTTP Testing
  http_mock_adapter: ^0.6.1

  # Coverage
  coverage: ^1.9.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/masjid_logo.png
