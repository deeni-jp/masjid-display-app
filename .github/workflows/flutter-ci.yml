name: Flutter CI/CD

# Checks (format, analyze, tests) run on every push to any branch and on pull
# requests, so contributors get feedback before review. Android builds run on
# main, on version tags (v*) and on manual runs, but only when the signing and
# Firebase secrets are set (see docs/ci-cd.md); otherwise they're skipped.
# iOS builds and Firestore rules deploys are manual
# (Actions -> Flutter CI/CD -> Run workflow).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS (needs the iOS project to be set up)"
        type: boolean
        default: false
      deploy_rules:
        description: "Deploy Firestore rules to Firebase"
        type: boolean
        default: false

# A newer push to the same branch/PR cancels the older, still-running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: bash .github/scripts/create-env.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        # Errors and warnings fail; infos are listed but don't fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # Android builds need this masjid's signing key and Firebase config. The
  # public template (and a fresh fork) has neither, so the build is skipped
  # there instead of failing.
  android-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Android build skipped: set the GOOGLE_SERVICES_JSON and ANDROID_KEYSTORE_BASE64 secrets to build (docs/ci-cd.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: [analyze, android-secrets]
    runs-on: ubuntu-latest
    if: >-
      needs.android-secrets.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: bash .github/scripts/create-env.sh

      - name: Install dependencies
        run: flutter pub get

      # Firebase config for Android (kept out of git). The secret holds the
      # full contents of android/app/google-services.json.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Decode keystore from base64
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      # Create key.properties file
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Clean up sensitive files
      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f android/app/google-services.json

  build-ios:
    needs: analyze
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: bash .github/scripts/create-env.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/

  # Manual on purpose: deploying rules changes live database security.
  deploy-firebase:
    needs: analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_rules
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        run: bash .github/scripts/create-env.sh

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Deploys to the project in FIREBASE_PROJECT_ID (.env).
      - name: Deploy Firestore Rules
        run: |
          project=$(sed -n 's/^FIREBASE_PROJECT_ID=//p' .env | tr -d '[:space:]')
          if [ -z "$project" ]; then
            echo "::error::FIREBASE_PROJECT_ID is empty in .env"
            exit 1
          fi
          firebase deploy --only firestore:rules,firestore:indexes \
            --project "$project" --token "${{ secrets.FIREBASE_TOKEN }}"

  # Version tags (v*) publish a GitHub release with the APK, so masjids that
  # don't use Google Play can download and install it directly.
  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: release-aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
