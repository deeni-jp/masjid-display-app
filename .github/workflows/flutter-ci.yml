name: Flutter CI/CD

# Checks (format, analyze, tests) run on every push to any branch and on pull
# requests, so contributors get feedback before review. Android builds run on
# main, on version tags (v*) and on manual runs. iOS builds and Firestore rules
# deploys are manual (Actions -> Flutter CI/CD -> Run workflow).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS (needs the iOS project to be set up)"
        type: boolean
        default: false
      deploy_rules:
        description: "Deploy Firestore rules to Firebase"
        type: boolean
        default: false

# A newer push to the same branch/PR cancels the older, still-running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        run: |
          cat > .env << EOF
          # CI Environment Configuration (public values only: .env ships in the app)
          ALADHAN_API_METHOD=3
          ALADHAN_SCHOOL=1
          PUSH_WORKER_URL=${{ vars.PUSH_WORKER_URL }}
          APP_CHECK_WEB_SITE_KEY=${{ vars.APP_CHECK_WEB_SITE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        # Errors and warnings fail; infos are listed but don't fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        run: |
          cat > .env << EOF
          # CI Environment Configuration (public values only: .env ships in the app)
          ALADHAN_API_METHOD=3
          ALADHAN_SCHOOL=1
          PUSH_WORKER_URL=${{ vars.PUSH_WORKER_URL }}
          APP_CHECK_WEB_SITE_KEY=${{ vars.APP_CHECK_WEB_SITE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      # Firebase config for Android (kept out of git). The secret holds the
      # full contents of android/app/google-services.json.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Decode keystore from base64
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      # Create key.properties file
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Clean up sensitive files
      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f android/app/google-services.json

  build-ios:
    needs: analyze
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create .env file
        run: |
          cat > .env << EOF
          # CI Environment Configuration (public values only: .env ships in the app)
          ALADHAN_API_METHOD=3
          ALADHAN_SCHOOL=1
          PUSH_WORKER_URL=${{ vars.PUSH_WORKER_URL }}
          APP_CHECK_WEB_SITE_KEY=${{ vars.APP_CHECK_WEB_SITE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/

  # Manual on purpose: deploying rules changes live database security.
  deploy-firebase:
    needs: analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_rules
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}"

      # Uncomment if you want to deploy Firebase Functions
      # - name: Deploy Firebase Functions
      #   run: firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"

  # Optional: Create GitHub Release on tag
  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: release-aab

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-release.apk
            app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
